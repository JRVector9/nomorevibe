name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nomorevibe
          POSTGRES_PASSWORD: nomorevibe
          POSTGRES_DB: nomorevibe_test
        ports: ["55435:5432"]
        options: >-
          --health-cmd "pg_isready -U nomorevibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # PageProps 같은 라우트 전역 타입은 Next가 .next/types에 만든다.
      # 새 체크아웃에는 그 파일이 없으므로 타입 검사 전에 먼저 생성한다.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
        env:
          # 빌드 중 페이지가 DB를 건드리지 않지만, 설정 누락으로 실패하지 않게 지정
          DATABASE_URL: postgres://nomorevibe:nomorevibe@localhost:55435/nomorevibe_test
