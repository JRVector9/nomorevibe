  color: var(--text-2);
  font-size: 13px;
  margin-bottom: 20px;
}
.empty-state .row-title {
  margin-bottom: 8px;
}
.empty-suggest {
  max-width: 640px;
  margin: 0 auto;
}
.empty-suggest + .empty-suggest {
  margin-top: 20px;
}
.empty-suggest + .secondary {
  margin-top: 24px;
}
.empty-suggest h3, .empty-suggest h4 {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
}
.empty-suggest .chips {
  justify-content: center;
}
.skeleton-card {
  background: var(--bg-soft);
  border-radius: 18px;
  overflow: hidden;
}
.skeleton-visual {
  aspect-ratio: 16 / 9;
  background: var(--border);
}
.skeleton-body {
  padding: 16px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.skeleton-line {
  height: 14px;
  border-radius: 7px;
  background: var(--border);
}
.skeleton-short {
  width: 60%;
}
.skeleton-title {
  width: 320px;
  max-width: 70vw;
  height: 26px;
}
.skeleton-tabs {
  width: min(300px, 80%);
  height: 44px;
  border-radius: 980px;
  background: var(--bg-soft);
}

  .skeleton-card, .skeleton-title, .skeleton-tabs {
    animation: skeleton-pulse 1.6s ease-in-out infinite;
  }
}
@keyframes skeleton-pulse {
  50% {
    opacity: 0.55;
  }
}
.unclaimed-block {
  margin-top: 28px;
}
.unclaimed-block h2 {
  font-size: 15px;
  font-weight: 800;
}
.unclaimed-block p {
  font-size: 13px;
  color: var(--text-2);
  margin-top: 4px;
}
dialog {
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: 0 24px 90px rgba(0, 0, 0, 0.19);
  width: min(670px, calc(100% - 32px));
  max-height: 88dvh;
  overflow: auto;
  color: var(--text);
  background: var(--bg-card);
}
dialog:modal {
  margin: auto;
}
@media (max-width: 640px) {
  dialog:modal {
    margin: auto 0 0;
    width: 100%;
    max-width: 100%;
    border-radius: 22px 22px 0 0;
    border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
}
dialog[open]:not(:modal) {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
  z-index: 80;
  box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.35), 0 24px 90px rgba(0, 0, 0, 0.19);
}
dialog::backdrop {
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(5px);
}
.modal-head {
  position: sticky;
  top: 0;
  background: var(--bg-card);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--bg-card) 94%, transparent);
  }
  backdrop-filter: blur(10px);
  padding: 21px 26px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
  z-index: 2;
}
.modal-head h2 {
  font-size: 18px;
  letter-spacing: -0.4px;
}
.close-btn {
  height: 32px;
  width: 32px;
  border-radius: 8px;
  background: var(--bg-soft);
  color: var(--text-2);
  display: grid;
  place-items: center;
}
.modal-body {
  padding: 24px 26px 28px;
}
.modal-body h3 {
  font-size: 15px;
  margin: 22px 0 8px;
}
.modal-body h3:first-child {
  margin-top: 0;
}
.modal-body p {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.9;
  margin: 8px 0;
}
.formula {
  display: block;
  padding: 13px 15px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 9px;
  font: 13px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace;
  color: var(--text);
  margin: 12px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.method-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 13px 0;
}
.method-table td, .method-table th {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}
.method-table th {
  font-weight: 600;
  background: var(--bg-soft);
}
.method-table td:first-child {
  color: var(--text-2);
  width: 25%;
}
.notice {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-2);

  font-size: 13px;
  line-height: 1.8;
  margin: 14px 0;

.metric-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin: 10px 0 19px;
}
.metric-links button {
  background: var(--accent-soft);
  color: var(--accent-ink);
  border-radius: 7px;
  font-size: 13px;
  padding: 7px 10px;
}
.method-more {
  margin: 8px 0;
}
.method-more summary {
  cursor: pointer;
  padding: 6px 0;
  font-size: 13px;
  color: var(--accent-ink);
}
.method-rule {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 25px 0;
}
.method-foot {
  font-size: 13px;
  color: var(--text-2);
}
.secondary {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  border-radius: 9px;
  padding: 10px 15px;
  font-size: 13px;
  color: var(--text-2);
}
.mobile-bottom {
  display: none;
}
.star-metric {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
  white-space: nowrap;
}
.star-metric small {
  font-size: 13px;
}
.star-change-up {
  color: var(--up);
}
.star-change-down {
  color: var(--text-2);
}
.star-change-neutral {
  color: var(--text-2);
}
.popular-filter {
  display: inline-flex;
  gap: 9px;
  align-items: center;
  white-space: nowrap;
  cursor: pointer;
  font-size: 14px;
  min-height: 44px;
}
.popular-filter input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

  display: -webkit-box;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
  line-height: 18px;
  margin: 0;
  color: var(--text-2);
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  white-space: normal;
  overflow-wrap: anywhere;
}
.popular-empty {
  padding: 38px 18px;
  text-align: center;
  color: var(--text-2);
  font-size: 14px;
  flex: 1;

  }

    overflow-x: auto;
    margin: 0 -16px;
    padding: 0 16px;
    scrollbar-width: none;
  }

    height: 44px;
    flex-shrink: 0;

    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nmb-header {
    height: auto;
  }
  .header-row {
    height: auto;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding-top: 6px;
    padding-bottom: 10px;
  }
  .header-search {
    order: 3;
    flex-basis: 100%;
  }
  .key {
    display: none;
  }
  .header-search input {
    padding-right: 14px;
  }
  .saved-nav {
    margin-left: auto;
  }
  .nmb-footer {
    padding-bottom: 95px;
  }
  .mobile-bottom {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    justify-content: space-around;
    background: var(--bg);
    @supports (color: color-mix(in lab, red, red)) {
      background: color-mix(in srgb, var(--bg) 96%, transparent);
    }
    backdrop-filter: blur(15px);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }

    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 4px;
    color: var(--text-2);
    font-size: 13px;
    min-width: 55px;

    color: var(--accent-ink);
  }

/*
 * 관리자 색 토큰(2026-10-08 UX 감사 ADM-14·25).
 *
 * 공개 사이트의 accent 는 브랜드 빨강이라 "선택됨·기본 버튼·포커스"와 "오류·위험"이 같은 색이었다. 관리자 범위에서만
 * accent 를 중립 파랑으로 바꾸고, 빨강(--color-danger = --down)은 실패·파괴적 행동에만 쓴다.
 * 토큰을 body 에 두는 까닭: body 배경도 같은 값을 따라 캔버스 끝(스크롤 넘침)까지 어두워진다.
 * --color-* 를 여기서 다시 잇는 까닭: Tailwind 가 :root 에서 --color-accent: var(--accent) 를 이미 풀어 두므로
 * --accent 만 바꾸면 var(--color-accent) 를 쓰는 CSS 는 여전히 빨강을 본다.
 *
 * 화면이 쓸 이름 — accent(선택·기본 버튼·포커스·링크), danger(실패·파괴), warn(사람이 볼 것·지연), ok(정상),
 * neutral / neutral-soft(중립 배지 글자·바탕), brand(로고 점만).
 */
body:has(.admin-area) {
  /* 2026-11-12 「1인 운영 콘솔 시안」 — Tailwind 로 그린 관리자 화면도 운영 콘솔(prototype.css)과 같은 색을 쓴다.
     --text-2 = 시안 --muted, --text-3 = 시안 --faint(큰 글자·표시만), 링크·선택은 시안 --link, 채운 단추(bg-accent-solid)는 먹색. */
  --bg: #ffffff; /* 시안의 콘솔 틀과 같은 흰 바탕(2026-11-12 사용자 「너무 칙칙해서 잘 안 보여」) */
  --bg-soft: #f7f8f5;
  --bg-card: #ffffff;
  --bg-hover: #eceee8;
  --border: #e0e4db;
  --border-strong: #c9cfc4;
  --text: #1c2420;
  --text-2: #5d6861;
  --text-3: #8b948d;
  --up: #2c7a4b;
  --down: #b3392c;
  --warn: #8f6400;
  --accent: #2a55c0;
  --accent-ink: #2a55c0;
  --accent-solid: #1c2420;
  --accent-soft: rgba(42, 85, 192, 0.1);
  --brand: #d63a40;

  --color-bg: var(--bg);
  --color-bg-soft: var(--bg-soft);
  --color-bg-card: var(--bg-card);
  --color-bg-hover: var(--bg-hover);
  --color-line: var(--border);
  --color-fg: var(--text);
  --color-fg-2: var(--text-2);
  --color-fg-3: var(--text-3);
  --color-up: var(--up);
  --color-down: var(--down);
  --color-warn: var(--warn);
  --color-accent: var(--accent);
  --color-accent-ink: var(--accent-ink);
  --color-accent-solid: var(--accent-solid);
  --color-accent-soft: var(--accent-soft);
  --color-danger: var(--down);
  --color-ok: var(--up);
  --color-neutral: var(--text-2);
  --color-neutral-soft: var(--bg-hover);
  --color-brand: var(--brand);
}

/* 다크 — 사이드바 아래 토글이 html 에 data-admin-theme 을 단다. 없으면(시스템) 기기 설정을 따른다 */
html[data-admin-theme="dark"] body:has(.admin-area) {
  color-scheme: dark;
  --bg: #171d19;
  --bg-soft: #1c231e;
  --bg-card: #212923;
  --bg-hover: #29322b;
  --border: #364037;
  --border-strong: #4a564b;
  --text: #e3eadf;
  --text-2: #a7b3a6;
  --text-3: #7f8b80;
  --up: #7fd19b;
  --down: #ff9d8f;
  --warn: #e6c26a;
  --accent: #a9bcff;
  --accent-ink: #a9bcff;
  --accent-solid: #3e4b41;
  --accent-soft: rgba(169, 188, 255, 0.16);
  --brand: #ff6b70;
  --star: #f6b73c;
}
@media (prefers-color-scheme: dark) {
  html:not([data-admin-theme="light"]) body:has(.admin-area) {
    color-scheme: dark;
    --bg: #171d19;
    --bg-soft: #1c231e;
    --bg-card: #212923;
    --bg-hover: #29322b;
    --border: #364037;
    --border-strong: #4a564b;
    --text: #e3eadf;
    --text-2: #a7b3a6;
    --text-3: #7f8b80;
    --up: #7fd19b;
    --down: #ff9d8f;
    --warn: #e6c26a;
    --accent: #a9bcff;
    --accent-ink: #a9bcff;
    --accent-solid: #3e4b41;
    --accent-soft: rgba(169, 188, 255, 0.16);
    --brand: #ff6b70;
    --star: #f6b73c;
  }
}

.admin-area{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh;background:var(--color-bg)}
/* 보이지 않지만 읽히는 글자 — 접힌 메뉴 이름, 배지 설명 */
.admin-vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* 본문으로 건너뛰기(ADM-31) — 공개 레이아웃의 .skip 은 #main(사이드바 포함)으로 가므로 관리자에서는 숨긴다 */
.admin-skip{position:fixed;left:12px;top:-80px;z-index:1000;border-radius:8px;padding:10px 14px;background:var(--color-fg);color:var(--color-bg);font-size:14px;font-weight:650}
.admin-skip:focus{top:12px}
.admin-sidebar{position:sticky;top:0;align-self:start;height:100dvh;overflow-y:auto;border-right:1px solid var(--color-line);background:var(--color-bg-card);padding:18px 12px;display:flex;flex-direction:column}
.admin-brand{display:block;font-size:21px;font-weight:850;letter-spacing:-.8px;padding:0 12px;color:var(--color-fg)}
.admin-brand-full>span,.admin-brand-short>span{color:var(--color-brand)}
.admin-brand-full{display:block}
.admin-brand small{display:block;font-size:10px;letter-spacing:.15em;color:var(--color-fg-3);margin-top:6px;font-weight:650}
.admin-brand-short{display:none}
.admin-sidebar-menu{display:flex;flex-direction:column;flex:1}
.admin-navigation{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.admin-nav-group{display:flex;flex-direction:column;gap:2px}
.admin-nav-group-title{padding:0 10px 2px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--color-fg-3)}
.admin-nav-group ul{display:flex;flex-direction:column;gap:2px}
.admin-navigation a{position:relative;display:flex;align-items:flex-start;gap:8px;padding:6px 10px;border-radius:8px;color:var(--color-fg-2);font-size:14px;font-weight:650}
.admin-navigation a svg{flex:none;margin-top:2px}
.admin-nav-text{display:flex;flex:1 1 auto;flex-direction:column;min-width:0}
.admin-navigation .admin-nav-badge{margin-left:auto}
.admin-navigation small{font-size:11px;font-weight:400;color:var(--color-fg-3)}
.admin-navigation a:hover{background:var(--color-bg-soft)}
.admin-navigation a[aria-current=page]{color:var(--color-accent);background:var(--color-accent-soft)}
/* 메뉴 배지 — critical(빨강): 지금 막힘·약속 넘김, warn(주황): 사람이 볼 것, neutral(회색): 참고 수 */
.admin-nav-badge{display:inline-block;flex:none;white-space:nowrap;margin-left:6px;border-radius:999px;padding:0 7px;font-size:13px;font-weight:700;line-height:19px;font-family:var(--font-mono);vertical-align:1px;background:color-mix(in srgb,var(--color-warn) 14%,transparent);color:var(--color-warn)}
.admin-nav-badge[data-tone=critical],.admin-nav-badge[data-tone=bad]{background:var(--color-danger);color:#fff}
.admin-nav-badge[data-tone=neutral]{background:var(--color-neutral-soft);color:var(--color-neutral)}
.admin-sidebar-bottom{display:grid;gap:12px;margin:16px 10px 0;padding-top:14px;border-top:1px solid var(--color-line);font-size:12px;color:var(--color-fg-2)}
.admin-sidebar-bottom p{font-size:11px;line-height:1.7;color:var(--color-fg-3)}
.admin-account{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.admin-account span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono)}
.admin-sidebar-button{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:4px 6px;font-size:12px;font-weight:650;color:var(--color-fg-2)}
.admin-sidebar-button:hover{background:var(--color-bg-soft);color:var(--color-fg)}
/* 테마 토글 — 라이트/다크/시스템 */
.admin-theme{display:flex;border:1px solid var(--color-line);border-radius:8px;padding:2px;gap:2px}
.admin-theme button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:3px;border-radius:6px;padding:4px 2px;font-size:12px;white-space:nowrap;color:var(--color-fg-3)}
.admin-theme button[aria-pressed=true]{background:var(--color-accent-soft);color:var(--color-accent);font-weight:650}
.admin-content{overflow-wrap:anywhere;min-width:0;padding:0 24px 20px;width:100%;max-width:1520px;margin:0 auto}
.admin-content:focus{outline:none}
/* 모든 관리자 화면 머리의 갱신 줄(LiveBar) — 오른쪽에 작게. 좁은 화면에서는 줄을 바꾼다 */
.admin-live-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 12px;padding:8px 0 0;font-size:13px;color:var(--color-fg-2)}
.admin-live-bar time{font-family:var(--font-mono,ui-monospace,monospace);font-variant-numeric:tabular-nums;color:var(--color-fg-2)}
.admin-live-bar button{display:inline-flex;align-items:center;min-height:28px;border:1px solid var(--color-line);border-radius:8px;padding:0 10px;font-size:13px;font-weight:600;color:var(--color-fg-2);background:var(--color-bg-card)}
.admin-live-bar button:hover{color:var(--color-fg)}
.admin-live-bar button[aria-disabled="true"]{opacity:.6;cursor:progress}
@media (max-width:760px){.admin-live-bar button{min-height:44px;min-width:44px}}
.admin-live-bar .admin-live-toggle[aria-checked="false"]{border-style:dashed}
.admin-content>main{width:100%;max-width:none;margin:0;padding-left:0;padding-right:0}
.admin-content h1{letter-spacing:-.7px}
.admin-menu-toggle,.admin-rail-toggle{display:none}
.admin-area a:focus-visible,.admin-area button:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px}
/* 넓은 표의 가로 스크롤 — ScrollTable(components/ScrollTable.tsx)이 쓴다 */
.admin-table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.admin-table-scroll:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}
.admin-worker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.admin-worker{border:1px solid var(--color-line);background:var(--color-bg-card);border-radius:12px;padding:20px;min-width:0}
.admin-worker h2{font-size:17px;font-weight:750}
.admin-worker p{font-size:12px;color:var(--color-fg-3);line-height:1.6}
.admin-worker code{display:block;font-size:12px;margin:3px 0 14px;color:var(--color-fg-3);overflow-wrap:anywhere}
.admin-worker dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.admin-worker dt{font-size:11px;color:var(--color-fg-3)}
.admin-worker dd{font-size:13px;margin-top:3px;font-weight:650;overflow-wrap:anywhere}
.admin-worker summary{cursor:pointer;font-size:13px;color:var(--color-accent);padding:10px 0;min-height:44px}
.admin-job-detail{border-top:1px solid var(--color-line);padding:12px 0}
.admin-job-detail strong{font-size:13px}
.admin-job-detail dl{margin:10px 0;font-size:12px}
.admin-job-detail pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;font-size:11px}
.admin-refresh{border:1px solid var(--color-line);padding:9px 14px;border-radius:8px;min-height:44px;font-size:13px;cursor:pointer}
@media(max-width:1150px){.admin-content{padding:0 22px 24px}.admin-worker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/*
 * 접힌 메뉴(ADM-22) — 761~1279px 에서는 아이콘만 남긴다. 이름은 .admin-vh 처럼 읽히고 마우스에는 title 로 뜬다.
 * "메뉴 이름 펼치기"를 누르면 data-rail=expanded 로 넓은 메뉴가 돌아온다.
 */
@media(min-width:761px) and (max-width:1279px){
  .admin-rail-toggle{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 0;border:1px solid var(--color-line);border-radius:8px;padding:6px;min-height:36px;font-size:12px;color:var(--color-fg-2)}
  .admin-rail-toggle:hover{background:var(--color-bg-soft)}
  .admin-area:not([data-rail=expanded]){grid-template-columns:64px minmax(0,1fr)}
  .admin-area:not([data-rail=expanded]) .admin-sidebar{padding:18px 8px}
  .admin-area:not([data-rail=expanded]) .admin-brand{padding:0;text-align:center;font-size:18px}
  .admin-area:not([data-rail=expanded]) .admin-brand-full,
  .admin-area:not([data-rail=expanded]) .admin-nav-text,
  .admin-area:not([data-rail=expanded]) .admin-nav-group-title,
  .admin-area:not([data-rail=expanded]) .admin-rail-label,
  .admin-area:not([data-rail=expanded]) .admin-sidebar-label{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .admin-area:not([data-rail=expanded]) .admin-brand-short{display:block}
  .admin-area:not([data-rail=expanded]) .admin-nav-group+.admin-nav-group{border-top:1px solid var(--color-line);padding-top:12px}
  .admin-area:not([data-rail=expanded]) .admin-navigation a{justify-content:center;padding:10px 0}
  .admin-area:not([data-rail=expanded]) .admin-navigation a svg{margin-top:0}
  .admin-area:not([data-rail=expanded]) .admin-nav-badge{position:absolute;top:2px;right:2px;margin:0;padding:0 4px;font-size:11px;line-height:15px}
  .admin-area:not([data-rail=expanded]) .admin-sidebar-bottom{margin:16px 0 0;justify-items:center}
  .admin-area:not([data-rail=expanded]) .admin-theme{flex-direction:column;border:0;padding:0}
  .admin-area:not([data-rail=expanded]) .admin-theme button{padding:6px}
  .admin-area:not([data-rail=expanded]) .admin-account{flex-direction:column}
  .admin-area:not([data-rail=expanded]) .admin-sidebar-bottom p{display:none}
}
@media(max-width:760px){.admin-area{display:block}.admin-sidebar{height:auto;position:sticky;z-index:30;padding:14px 16px;border-right:0;border-bottom:1px solid var(--color-line);overflow:visible}.admin-brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.admin-brand{padding:0;font-size:18px}.admin-menu-toggle{display:block;font-size:13px;padding:10px 12px;border:1px solid var(--color-line);border-radius:8px;min-height:44px}.admin-sidebar-menu{display:none}.admin-sidebar-menu.is-expanded{display:block;max-height:70dvh;overflow:auto}.admin-nav-group ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.admin-navigation{margin-top:16px}.admin-sidebar-bottom{margin-top:14px}.admin-content{padding:0 16px 24px}.admin-worker-grid{grid-template-columns:1fr}.admin-login-area{min-height:100dvh}}

/* 상태 점(StatusDot, ADM-31) — 색만이 아니라 모양과 글자로도 가른다: 정상 ●, 지연 ▲, 실패 ■, 대기 ○ */
.admin-status{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--color-fg-2);white-space:nowrap}
.admin-status-mark{flex:none;width:9px;height:9px;border-radius:50%;background:var(--color-ok)}
.admin-status[data-state=delayed]{color:var(--color-warn)}
.admin-status[data-state=delayed] .admin-status-mark{width:10px;height:9px;border-radius:0;background:var(--color-warn);clip-path:polygon(50% 0,100% 100%,0 100%)}
.admin-status[data-state=failed]{color:var(--color-danger)}
.admin-status[data-state=failed] .admin-status-mark{border-radius:2px;background:var(--color-danger)}
.admin-status[data-state=idle]{color:var(--color-fg-3)}
.admin-status[data-state=idle] .admin-status-mark{background:transparent;border:2px solid var(--color-fg-3)}

/* 확인 창(ConfirmAction, ADM-06) */
.admin-confirm{width:min(560px,calc(100vw - 32px));max-height:min(80dvh,720px);margin:auto;border:1px solid var(--color-line);border-radius:14px;padding:0;background:var(--color-bg-card);color:var(--color-fg);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.admin-confirm[data-tone=danger]{border-color:color-mix(in srgb,var(--color-danger) 45%,var(--color-line))}
.admin-confirm::backdrop{background:rgba(10,14,24,.45)}
.admin-confirm-body{display:grid;gap:12px;padding:20px 22px;font-size:13px}
.admin-confirm h2{font-size:16px;font-weight:750}
.admin-confirm-count{color:var(--color-fg-3);font-weight:600}
.admin-confirm-targets{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto;padding:2px 0}
.admin-confirm-targets li{border-radius:6px;padding:1px 6px;background:var(--color-bg-soft);font-weight:600}
.admin-confirm label{display:grid;gap:4px;font-weight:650}
.admin-confirm select,.admin-confirm textarea{border:1px solid var(--color-line);border-radius:8px;padding:6px 8px;background:var(--color-bg);color:var(--color-fg);font-weight:400}
.admin-confirm-body ul:not(.admin-confirm-targets){display:grid;gap:2px;margin:0;padding-left:18px;list-style:disc;color:var(--color-fg-2)}
.admin-confirm-error{color:var(--color-danger);font-weight:600}
.admin-confirm-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.admin-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid var(--color-line);border-radius:8px;padding:6px 14px;background:var(--color-bg-card);color:var(--color-fg-2);font-size:13px;font-weight:650;white-space:nowrap}
.admin-button:hover{color:var(--color-fg)}
.admin-button:disabled{opacity:.55;cursor:default}
.admin-button[data-tone=primary]{border-color:var(--color-accent-solid);background:var(--color-accent-solid);color:#fff}
.admin-button[data-tone=danger]{border-color:var(--color-danger);background:var(--color-danger);color:#fff}

/* 알림(Toast, ADM-12) — 화면 오른쪽 아래, 가장 최근 것이 아래 */
.admin-toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:grid;gap:8px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.admin-toast{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--color-line);border-left:4px solid var(--color-ok);border-radius:10px;padding:10px 12px;background:var(--color-bg-card);color:var(--color-fg);box-shadow:0 8px 28px rgba(0,0,0,.16);font-size:13px;animation:admin-toast-in .18s ease-out}
.admin-toast[data-tone=warn]{border-left-color:var(--color-warn)}
.admin-toast[data-tone=error]{border-left-color:var(--color-danger)}
.admin-toast-message{flex:1 1 180px;min-width:0;font-weight:600}
.admin-toast a,.admin-toast-undo{color:var(--color-accent);font-weight:650}
.admin-toast-undo:disabled{opacity:.55}
.admin-toast-close{margin-left:auto;border-radius:6px;padding:2px 6px;color:var(--color-fg-3)}
.admin-toast-close:hover{background:var(--color-bg-soft);color:var(--color-fg)}
@keyframes admin-toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.admin-toast{animation:none}}

/* 내려달라는 요청 한 줄(TakedownStrip) — 심사 큐 머리. 주황: 24시간 안, 빨강: 넘김 */
.takedown-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border:1px solid color-mix(in srgb,var(--color-warn) 40%,var(--color-line));border-radius:10px;padding:8px 12px;font-size:13px;color:var(--color-fg-2);background:color-mix(in srgb,var(--color-warn) 8%,var(--color-bg-card))}
.takedown-strip[data-tone=bad]{border-color:color-mix(in srgb,var(--color-down) 40%,var(--color-line));background:color-mix(in srgb,var(--color-down) 7%,var(--color-bg-card))}
.takedown-strip b{font-weight:700;color:var(--color-fg)}

/* 전역 검색(⌘K, ADM-05) — 사이드바 맨 위 단추와 검색 창. 창은 확인 창(admin-confirm)의 틀을 그대로 쓴다 */

/* Seven operational workspaces — shared shell only; pages keep their authenticated reads and actions. */
body:has(.admin-area) {

.admin-area{grid-template-columns:222px minmax(0,1fr);color:var(--color-fg)}

.admin-workspace-subtabs a{display:inline-flex;align-items:center;min-height:32px;padding:5px 10px;border:1px solid var(--color-line);border-radius:6px;background:var(--color-bg-card);color:var(--color-fg-2);font-size:11px}

.admin-workspace-view .admin-page-eyebrow,.admin-workspace-view .admin-page-lead{display:none}
/* A project's own identity is content, not the removed generic workspace title. */
.admin-area[data-admin-detail=product] .admin-workspace-view h1{position:static;width:auto;height:auto;margin:0;overflow:visible;clip:auto;white-space:normal;font-size:22px;font-weight:750}

/* Port of the approved HTML prototype at :8788/final/index.html. Layout and design tokens are preserved; data is supplied by server pages. */

.admin-prototype {
  /* 2026-11-12 「1인 운영 콘솔 시안」의 토큰 — 색은 상태에만 쓰고, 단추는 먹색 하나(--primary).
     옛 이름(--surface-2·--soft·--blue·--green·--amber·--red)은 화면 수백 곳이 쓰므로 이름은 두고 값만 시안 값으로 바꿨다:
     --surface-2 = 시안 --sunken, --blue = --link, --green = --ok, --amber = --warn, --red = --bad. */
  /* 2026-11-12 사용자 「시안에서 화이트 컬러 적용한 것처럼」: 시안의 콘솔 틀은 흰 바탕이다(#f2f3ef 는 시안 문서의 바깥 여백) — 페이지 바탕도 흰색 */
  --bg: #fff;
  --surface: #fff;
  --surface-2: #f7f8f5;
  --sunken: var(--surface-2);
  --ink: #1c2420;
  --muted: #5d6861;
  /* 글자로도 쓰이는 회색(작은 글자 4.5:1) — 점·선 같은 표시만은 --faint */
  --soft: #6b766e;
  --faint: #8b948d;
  --line: #e0e4db;
  --primary: #1c2420;
  --primary-ink: #fff;
  --blue: #2a55c0;
  --link: var(--blue);
  --blue-soft: #eaeffa;
  --green: #2c7a4b;
  --ok: var(--green);
  --green-soft: #e8f2eb;
  --amber: #8f6400;
  --warn: var(--amber);
  --amber-soft: #faf2da;
  --red: #b3392c;
  --bad: var(--red);
  --red-soft: #fbecea;
  --rail: #1c2420;
  --shadow: 0 10px 30px #1c24200a;
  --radius: 10px;
  --admin-font-delta: 0px;
  /* 글꼴 — 관리자 layout 이 next/font 로 실어 --font-console-* 를 준다(console-fonts.ts). 없으면 이름으로 찾고, 그다음 시스템 글꼴 */
  --f-sans: var(--font-console-sans, "IBM Plex Sans KR"), -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: var(--font-console-mono, "IBM Plex Mono"), ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.admin-prototype * {
  box-sizing: border-box;
}
.admin-prototype {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}
.admin-prototype {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: calc(13px + var(--admin-font-delta, 0px));
  line-height: 1.65;
  word-break: keep-all;
}
.admin-prototype button,.admin-prototype input,.admin-prototype textarea,.admin-prototype select {
  font: inherit;
}
/* 폼 요소 글자색은 base 층에 둔다 — 층 밖(unlayered)에 두면 Tailwind 유틸리티(@layer utilities)보다 늘 이겨서
   「bg-fg … text-bg」 단추의 글자가 배경색과 같아져 보이지 않았다(2026-11-07, 연결 저장·공유 한도 저장 등 관리자 단추 약 19곳).
   글자 크기(font: inherit)는 관리자 글자 크기 조절(--admin-font-delta)이 쓰므로 그대로 층 밖에 둔다. */
@layer base {
  .admin-prototype button,.admin-prototype input,.admin-prototype textarea,.admin-prototype select {
    color: inherit;
  }
  /* 링크 글자색, 단추 테두리 없음, 제목·문단 바깥 여백 0 도 base 층(2026-11-07 PR 5) — 층 밖에 두면 text-accent-ink·border·mt-2 같은
     유틸리티를 늘 이겨 화면에 적은 클래스가 먹지 않았다. 클래스가 없는 요소의 모양은 그대로다.
     링크 밑줄 없음(text-decoration: none)은 승인 시안의 모양이라 층 밖에 그대로 둔다 — 옮기면 underline 을 적은 링크 수백 곳에 밑줄이 새로 생긴다. */
  .admin-prototype a {
    color: inherit;
  }
  .admin-prototype button {
    border: 0;
  }
  .admin-prototype h1,.admin-prototype h2,.admin-prototype h3,.admin-prototype h4,.admin-prototype p {
    margin: 0;
  }
}
.admin-prototype a {
  text-decoration: none;
}
.admin-prototype button,.admin-prototype a {
  touch-action: manipulation;
}
.admin-prototype button {
  cursor: pointer;
}
.admin-prototype button:disabled {
  opacity: .45;
  cursor: default;
}
.admin-prototype button:focus-visible,.admin-prototype a:focus-visible,.admin-prototype input:focus-visible,.admin-prototype textarea:focus-visible,.admin-prototype select:focus-visible,.admin-prototype summary:focus-visible {
  outline: 3px solid #7792ff;

.admin-prototype h1,.admin-prototype h2,.admin-prototype h3,.admin-prototype h4 {

}
.admin-prototype h2 {
  font-size: calc(19px + var(--admin-font-delta, 0px));
}
.admin-prototype h3 {

.admin-prototype .small {

/* 시안의 「.flex」(가운데 정렬·9px 간격·줄바꿈)는 Tailwind 의 flex 유틸리티와 이름이 같다. 층 밖에 두면 items-start·gap-3·flex-nowrap 같은
   유틸리티를 늘 이겼고, 「flex flex-col」 칸의 자식이 가운데로 몰려 폭이 줄었다(ModelOpsPanel·확인 대화상자·LiveModels·검색 모델, 2026-11-07 PR 5).
   components 층에 두어 시안 화면(유틸리티 없이 「flex」만 쓴 곳)은 그대로 두고, 유틸리티를 적은 곳은 그 값이 이기게 한다.
   Tailwind 의 세로 flex(flex-col)는 기본(stretch)이 뜻이라 그것만 되돌린다. */
@layer components {
  .admin-prototype .flex {

.admin-prototype .mb {

.admin-prototype .break {

/* Bind the approved shell to the existing authenticated application controls. */
.admin-prototype.admin-area { display:block; min-height:100dvh; }
.admin-prototype .app-shell { min-height:100dvh; }
.admin-prototype .prototype-live { display:flex; align-items:center; gap:12px; }
.admin-prototype .live-indicator.paused { color:var(--muted); }
.admin-prototype .prototype-navigation a { text-decoration:none; }
.admin-prototype .prototype-navigation .nav-icon svg { width:15px; height:15px; }
.admin-prototype .nav-badge[data-tone=critical] { background:#b94a3f; color:#fff; }
.admin-prototype .sidebar .search-launch { cursor:pointer; gap:8px; }
.admin-prototype .search-launch>span { margin-right:auto; }
.admin-prototype .main-shell:focus,.admin-prototype #page:focus { outline:0; }
.admin-prototype .prototype-workspace-navigation { min-width:0; }
.admin-prototype .admin-workspace-tabs { margin-bottom:20px; }
.admin-prototype .admin-workspace-secondary { padding:0 0 18px; }
.admin-prototype .admin-workspace-view > main { max-width:none; margin:0; padding:0; }
.admin-prototype .legacy-advanced { margin-top:22px; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:14px; }
.admin-prototype .legacy-advanced>summary { cursor:pointer; font-size: calc(12px + var(--admin-font-delta, 0px)); color:var(--muted); font-weight:600; }
.admin-prototype .legacy-advanced[open]>summary { margin-bottom:16px; }
@media(max-width:850px) { .admin-prototype .prototype-live { gap:8px; } }
@media(max-width:500px) { .admin-prototype .prototype-live { gap:5px; } }
/* The public home page also defines .tabs. Its pill treatment is outside this design. */
.admin-prototype .tabs { background:transparent; border-radius:0; padding:0; overflow:visible; }
/* Restore the reference document's heading weight after the app's Tailwind preflight. */
.admin-prototype h2,.admin-prototype h3,.admin-prototype h4 { font-weight:700; }

/* A project name is content and keeps the reference hero typography. */
.admin-prototype[data-admin-detail=product] .project-hero h1 { font-size: calc(28px + var(--admin-font-delta, 0px)); font-weight:750; }
@media(max-width:850px) { .admin-prototype[data-admin-detail=product] .project-hero h1 { font-size: calc(25px + var(--admin-font-delta, 0px)); } }
@media(max-width:500px) { .admin-prototype[data-admin-detail=product] .project-hero h1 { font-size: calc(24px + var(--admin-font-delta, 0px)); } }

/* Quality modes navigate to real server views through links with the reference button appearance. */
.admin-prototype .segmented>a,.admin-prototype .segmented a {
  background: transparent;
  padding: 5px 10px;
  color: var(--muted);
  font-size: calc(10px + var(--admin-font-delta, 0px));
  border-radius: 4px;
  white-space: nowrap;
}

/* Typography uses an exact pixel delta in approved text regions; all other prototype surfaces keep their baseline. */
.admin-prototype .sidebar {
  --admin-font-delta: 2px;
}
/* Brand artwork, avatar initials, icons and status annotations keep their original scale. */
.admin-prototype .brand,
.admin-prototype .nav-icon,
.admin-prototype .nav-badge,
.admin-prototype .avatar,
.admin-prototype .top-avatar,
.admin-prototype .project-avatar,
.admin-prototype .icon-button,
.admin-prototype .tag,
.admin-prototype .read-stamp,
.admin-prototype .live-indicator,
.admin-prototype .freshness,
.admin-prototype .flow-state,
.admin-prototype .flow-model,
.admin-prototype .worker-card small,
.admin-prototype .callout,
.admin-prototype [data-admin-type="status"] {
  --admin-font-delta: 0px;
}
/* A status group inherits a 13px baseline; its tag and adjacent text link keep their own 10px/11px baselines. */
.admin-prototype .panel-head .right:has(> .tag, > .read-stamp) {
  --admin-font-delta: 0px;
  font-size: calc(13px + var(--admin-font-delta, 0px));
}
/* Application/observation annotations retain their existing type scale. */
.admin-prototype #apply,
.admin-prototype .admin-status,
.admin-prototype .panel-head .small.muted { --admin-font-delta:0px; }
.admin-prototype .callout {
  font-size: calc(13px + var(--admin-font-delta, 0px));
}

/* Reduce content body by 2 CSS px; headings, navigation and status annotations keep their current scale. */
.admin-prototype #page {
  --admin-font-delta: 2px;
  --admin-content-growth: 0px;
  --admin-heading-font-delta: 2px;
  font-size: calc(13px + var(--admin-font-delta, 0px));
}

/* The preserved admin detail rule currently renders project names at 22px. */
.admin-prototype.admin-area[data-admin-detail="product"] .project-hero h1 {
  font-size: calc(22px + var(--admin-font-delta, 0px));
}

 * Keep utility specificity unchanged. Prototype buttons/fields retain their own
 * font rules, while reused forms with a Tailwind font size receive the delta.
 */

.ai-accounts>.ops-row{padding-bottom:8px}.ai-provider-row{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:22px;align-items:center;padding:24px 0;border-bottom:1px solid var(--ops-line)}.ai-provider-row:last-of-type{border-bottom:0}
.ai-provider-name h4{font-size:21px;font-weight:750;margin:0 0 10px}.ai-provider-status>strong{font-size:16px;line-height:1.5}.ai-provider-status p{font-size:14px;margin:6px 0 0;overflow-wrap:anywhere}
.ops-center .ai-warning{color:var(--color-warn)}.ops-center .ai-success{color:var(--color-ok)}
.ai-notice{padding:15px 18px;background:var(--color-bg-soft);border:1px solid var(--ops-line);border-radius:8px;font-size:14px;line-height:1.6;margin:16px 0}.ai-notice p{margin:4px 0 12px}.ai-notice p:last-child{margin-bottom:0}.ai-notice.error{background:color-mix(in srgb,var(--color-danger) 8%,var(--color-bg-card));border-color:color-mix(in srgb,var(--color-danger) 35%,var(--color-line));color:var(--color-danger)}.ai-notice.error p{color:inherit}
.ai-model-fields{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:22px 0}.ai-model-fields fieldset{padding:0;border:0;min-width:0}.ai-model-fields legend{font-size:16px;font-weight:750;margin-bottom:18px}.ai-model-fields label{font-size:14px;font-weight:600}.ai-model-fields p{font-size:14px}
.ai-model-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;border-top:1px solid var(--ops-line);padding-top:22px}.ai-model-footer strong{font-size:16px}.ai-model-footer p{font-size:14px;max-width:65ch;margin-bottom:0}.ai-results{margin-top:24px}.ai-results h4{font-size:16px;font-weight:700;margin-bottom:10px}.ai-results>div{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--ops-line);padding:12px 0;font-size:14px}
.ai-applied dl{margin:20px 0}.ai-applied dl>div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;padding:13px 0;border-bottom:1px solid var(--ops-line);font-size:14px;line-height:1.6}.ai-applied dt{color:var(--color-fg-3)}.ai-applied dd{overflow-wrap:anywhere}.ai-applied details p{font-size:14px}
.ai-connect-dialog h2{font-size:24px}.ai-dialog-state{font-weight:700;padding:12px 0;border-bottom:1px solid var(--ops-line)}
.ai-connect-steps{padding-left:24px;margin:24px 0}.ai-connect-steps li{padding-left:7px;margin:0 0 28px;font-size:16px}.ai-connect-steps li::marker{font-weight:700;color:var(--color-accent)}.ai-connect-steps strong{line-height:1.6}.ai-connect-steps p{margin:8px 0 16px}.ai-connect-steps .ops-button{display:inline-flex;align-items:center;text-decoration:none}.ai-device{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--color-bg-soft);padding:14px 18px;border-radius:8px;margin-top:18px}.ai-device .ops-device-code{font-size:26px;letter-spacing:.07em;margin:0;color:var(--color-fg)}.ai-connect-steps form{margin-top:18px}.ai-connect-steps input{font-size:16px}.ai-dialog-footer{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--ops-line);padding-top:18px;margin-top:20px}

@media(max-width:760px){.ops-tabs{gap:16px;overflow-x:auto}.ops-tabs button{font-size:14px;white-space:nowrap}.ai-heading h2{font-size:23px}.ai-refresh{align-items:flex-start}.ai-provider-row{grid-template-columns:1fr;gap:14px;padding:22px 0}.ai-provider-row>.ops-actions{grid-column:auto}.ai-provider-name{display:flex;align-items:center;justify-content:space-between;gap:10px}.ai-provider-name h4{margin:0}.ai-model-fields{grid-template-columns:1fr;gap:24px}.ai-model-footer .ops-actions{width:100%}.ai-model-footer .ops-actions button{flex:1}.ai-applied dl>div{grid-template-columns:1fr;gap:5px}.ai-readiness{padding:16px}.ai-connect-dialog h2{font-size:21px}.ai-connect-steps{padding-left:20px}.ai-device{padding:12px}.ai-device .ops-device-code{font-size:22px}.ai-dialog-footer{justify-content:flex-start;flex-wrap:wrap}}

.ai-countdown{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;margin:12px 0;background:var(--color-bg-card);border:1px solid var(--ops-line);border-radius:8px;font-size:14px}.ai-countdown strong{font-size:18px;font-variant-numeric:tabular-nums;color:var(--color-accent)}
@media(max-width:760px){.ai-countdown{flex-wrap:wrap}.ai-countdown strong{font-size:17px}}

.ai-probe-reply{margin-top:12px;padding:12px 14px;border:1px solid var(--color-line);border-radius:10px;background:var(--color-bg-soft);max-width:560px}.ai-probe-reply>span{font-size:12px;color:var(--color-fg-3)}.ai-probe-reply p{display:flex;gap:12px;align-items:baseline;margin:8px 0 0!important}.ai-probe-reply b{flex:0 0 76px;font-size:12px;color:var(--color-fg-2)}.ai-probe-reply p span{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--color-fg)}
/* 한 화면 운영 콘솔 — 파이프라인 한 줄, 가운데 심사 대기, 오른쪽 서비스·작업 요약 */
.ops-center{padding-top:18px}
.ops-header.compact{align-items:center}.ops-header.compact h1{display:inline;font-size:22px;margin:0 10px 0 0}
.ops-snapshot-inline{font-size:13px;color:var(--color-fg-3)}
.ops-center .ops-tabs{margin:10px 0}.ops-center .ops-tabs button{font-size:14px;padding:8px 0}
.ops-console{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;align-items:start}
.ops-console-main{display:grid;gap:10px;min-width:0}
.ops-console-side{display:grid;gap:10px;min-width:0}
.ops-console-full{grid-column:1/-1}
.ops-mini{border:1px solid var(--ops-line);border-radius:12px;background:var(--color-bg-card);padding:8px 10px}
.ops-center .ops-mini h3{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:750;margin:0 0 4px}
.ops-center .ops-mini h3 small{display:inline;margin:0;font-weight:500}
.ops-mini table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.ops-mini td{padding:3px 2px;border-top:1px solid var(--ops-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ops-mini tr:first-child td{border-top:0}.ops-mini tr{cursor:pointer}.ops-mini tr:hover td{background:var(--color-bg-soft)}
.ops-mini td.n{width:72px;text-align:right;color:var(--color-fg-3);font-variant-numeric:tabular-nums}
.ops-mini ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.ops-center .ops-mini li small{display:block;margin:0}.ops-center .ops-mini p{margin:0}
@media(max-width:1100px){.ops-console{grid-template-columns:1fr}.ops-console-side{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}

/* 옮기는 중인 진행 막대 — 줄무늬가 흘러 멈춘 것과 구분된다 */
.ops-progress-live{background-image:linear-gradient(90deg,transparent 0 25%,rgba(255,255,255,.45) 25% 50%,transparent 50% 100%);background-size:28px 100%;animation:ops-progress-flow 1.1s linear infinite}
@keyframes ops-progress-flow{to{background-position:28px 0}}
@media(prefers-reduced-motion:reduce){.ops-progress-live{animation:none;background-image:none}}

.crawler-activity{display:grid;gap:16px;min-width:0}.crawler-activity>.dash-card{min-width:0}
.ops-center .crawler-activity small,.ops-center .crawler-activity code{font-size:13px}
.crawler-activity p{font-size:13px;line-height:1.6;margin:4px 0 12px;color:var(--color-fg-2)}
.crawler-links{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-bottom:14px}.crawler-links a{color:var(--color-accent)}
.crawler-table{width:100%;min-width:1280px;border-collapse:collapse;font-size:13px;text-align:left}
.crawler-table th,.crawler-table td{border-top:1px solid var(--color-line);padding:12px 10px;vertical-align:top}
.crawler-table thead th{border-top:0;padding-top:2px;color:var(--color-fg-3);font-weight:500}
.crawler-table tbody th{width:25%;font-weight:400}.crawler-table strong{font-weight:650}.crawler-table small,.crawler-table code{display:block;margin-top:5px;color:var(--color-fg-3);font-size:13px;line-height:1.5}
.crawler-table .crawler-note{max-width:32ch;color:var(--color-warn)}
.crawler-totals{display:grid;gap:8px;min-width:22ch}.crawler-totals span{font-variant-numeric:tabular-nums}
.crawler-detail-totals{list-style:none;display:grid;gap:10px;margin:8px 0 0;padding:0;font-size:13px}.crawler-detail-totals li{display:grid;gap:4px}.crawler-detail-totals strong{font-weight:600}.crawler-detail-totals span{color:var(--color-fg-2)}
.crawler-state{display:inline-flex;border:1px solid var(--color-line);border-radius:5px;padding:2px 6px;font-size:13px;line-height:1.5;white-space:nowrap;color:var(--color-fg-2)}
.crawler-state[data-tone=ok]{color:var(--color-ok);border-color:color-mix(in srgb,var(--color-ok) 35%,var(--color-line))}
.crawler-state[data-tone=warn]{color:var(--color-warn);border-color:color-mix(in srgb,var(--color-warn) 35%,var(--color-line))}
.crawler-state[data-tone=bad]{color:var(--color-danger);border-color:color-mix(in srgb,var(--color-danger) 35%,var(--color-line))}
.crawler-activity .crawler-muted{color:var(--color-fg-3);font-size:13px}.crawler-activity .crawler-notice{color:var(--color-warn);padding:10px 12px;border:1px solid var(--color-line);border-radius:6px}
.crawler-instances{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.crawler-instance{min-width:0;border:1px solid var(--color-line);border-radius:8px;padding:12px}
.crawler-instance-heading{display:flex;justify-content:space-between;align-items:start;gap:12px}.crawler-instance-heading strong{font-size:14px;overflow-wrap:anywhere}.crawler-instance small{display:block;font-size:13px;line-height:1.5;margin-top:4px;color:var(--color-fg-3)}
.crawler-lanes{list-style:none;margin:0;padding:0}.crawler-lanes li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid var(--color-line);font-size:13px}.crawler-lanes li:last-child{padding-bottom:0}.crawler-lanes b{font-weight:600}
.crawler-activity .crawler-footnote{margin:12px 0 0}.crawler-results details{border-top:1px solid var(--color-line);padding:10px 0;font-size:13px}.crawler-results details:first-child{border-top:0}.crawler-results summary{display:flex;align-items:center;flex-wrap:wrap;gap:10px;cursor:pointer;min-height:28px}.crawler-results summary::before{content:'▸';color:var(--color-fg-3)}.crawler-results details[open]>summary::before{content:'▾'}.crawler-results summary strong{font-weight:600}.crawler-results summary time{color:var(--color-fg-3)}
.crawler-results ul{list-style:none;display:grid;gap:8px;margin:10px 0 0;padding:0}.crawler-results li{display:flex;flex-wrap:wrap;gap:8px}.crawler-results li strong{font-weight:500}.crawler-results li span{color:var(--color-fg-3)}.crawler-results details>p{margin:10px 0 0}
@media(max-width:900px){.crawler-instances{grid-template-columns:1fr}.crawler-activity .dash-card-h{align-items:start;flex-wrap:wrap}.crawler-lanes li{grid-template-columns:minmax(0,1fr)}.crawler-table{min-width:1180px}}

/* The admin shell resets dialog padding. Keep the inset on an inner element so
   worker, job and account dialogs retain it regardless of stylesheet order. */
:is(.ops-center, .admin-prototype) dialog.ops-modal {
  width: min(760px, calc(100vw - 32px));
  max-width: 760px;
  max-height: calc(100dvh - 32px);
  margin: auto;
  padding: 0;
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--color-line);
  border-radius: 12px;
  background: var(--color-bg-card);
  color: var(--color-fg);
  font-size: 14px;
  line-height: 1.45;
}
.ops-modal-content { padding: 20px; min-width: 0; overflow-wrap: anywhere; }
.ops-center .ops-modal h2 { margin: 0; font-size: 20px; line-height: 1.3; }
.ops-center .ops-modal h3 { font-size: 15px; }
.ops-center .ops-modal .ops-row { gap: 8px 12px; align-items: flex-start; }
.ops-modal .ops-dialog-heading { min-width: 0; flex: 1; }
.ops-center .ops-modal p { margin: 6px 0; font-size: 14px; line-height: 1.45; }
.ops-center .ops-modal :is(code, small) { margin-top: 3px; font-size: 12px; line-height: 1.4; }
.ops-center .ops-modal code { color: var(--color-fg-2); }
.ops-center .ops-modal button { min-height: 36px; padding: 7px 12px; font-size: 13px; line-height: 1.4; }
.ops-center .ops-modal .ops-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; margin: 12px 0; }
.ops-center .ops-modal .ops-facts > div { padding: 7px 0; }
.ops-center .ops-modal .ops-facts dt { margin-bottom: 2px; font-size: 12px; line-height: 1.4; color: var(--color-fg-2); }
.ops-center .ops-modal .ops-facts dd { margin: 0; font-size: 13px; line-height: 1.4; }
.ops-center .ops-modal summary { padding: 7px 0; font-size: 13px; line-height: 1.4; }
.ops-center .ops-modal pre { margin: 6px 0 10px; padding: 10px 12px; border-radius: 6px; background: var(--color-bg-soft); font-size: 12px; line-height: 1.45; }
.ops-center .ops-modal :is(.ops-note, .ops-trace) { margin: 10px 0; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
.ops-center .ops-modal :is(input, select, textarea) { margin: 4px 0 8px; padding: 7px 10px; min-height: 36px; font-size: 14px; line-height: 1.4; }
.ops-center .ops-modal .ops-detail-grid { gap: 20px; margin-top: 14px; }
.ops-center .ops-modal .ops-job-item { padding: 8px 0; }
.ops-center .ops-modal .crawler-activity { gap: 6px; }
.ops-center .ops-modal .crawler-muted { color: var(--color-fg-2); font-size: 12px; }
.ops-center .ops-modal .crawler-detail-totals { gap: 8px; margin: 0; font-size: 13px; line-height: 1.4; }
.ops-modal .crawler-detail-totals li { gap: 3px; padding: 10px 12px; border: 1px solid var(--color-line); border-radius: 8px; }
.ops-modal .crawler-detail-totals strong { color: var(--color-fg); }
.ops-center .ops-modal .ai-connect-steps { margin: 12px 0; padding-left: 22px; }
.ops-center .ops-modal .ai-connect-steps li { margin-bottom: 14px; font-size: 14px; }
.ops-center .ops-modal .ai-connect-steps strong { line-height: 1.45; }
.ops-center .ops-modal .ai-connect-steps form { margin-top: 10px; }
.ops-center .ops-modal .ai-dialog-footer { margin-top: 12px; padding-top: 12px; }
@media (max-width: 520px) {
  .ops-modal-content { padding: 16px; }
  .ops-center .ops-modal .ops-facts { grid-template-columns: minmax(0, 1fr); }
  .ops-center .ops-modal .ops-facts > div { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 8px; }
  .ops-center .ops-modal .ops-facts dt { margin: 0; }
  .ops-center .ops-modal .ops-detail-grid { grid-template-columns: minmax(0, 1fr); }
  .ops-center .ops-modal .ai-device { gap: 10px; padding: 10px 12px; margin-top: 10px; }
}
