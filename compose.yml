# Local production-mode topology. Existing ports and deploy-pgdata volume are preserved.
# Build off-load, then stop/drain old consumers, run migrate once, and start the new release.
# See docs/operations/independent-workers-runbook.md. Do not scale a role above one yet.
x-runtime: &runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-worker-environment: &worker-environment
  DATABASE_URL: postgres://nomorevibe:nomorevibe@db:5432/nomorevibe
  NEXT_PUBLIC_SITE_URL: http://localhost:3200
  LOG_LEVEL: info
  WORKER_DRAIN_SECONDS: "45"
  WORKER_HEARTBEAT_TIMEOUT_SECONDS: "30"
  WORKER_PROGRESS_TIMEOUT_SECONDS: "90"

x-worker: &worker
  <<: *runtime
  image: nomorevibe-worker:${RELEASE_TAG:-local}
  build:
    context: .
    target: worker
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  cpus: 1.0

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nomorevibe
      POSTGRES_PASSWORD: nomorevibe
      POSTGRES_DB: nomorevibe
    volumes:
      - deploy-pgdata:/var/lib/postgresql/data
    ports:
      - "55437:5432"
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomorevibe"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Explicit release step, reused by every role. Never run migrations from app/worker entrypoints.
  migrate:
    image: nomorevibe-worker:${RELEASE_TAG:-local}
    build: { context: ., target: worker }
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://nomorevibe:nomorevibe@db:5432/nomorevibe
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    mem_limit: 512m
    healthcheck: { disable: true }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    <<: *runtime
    build: { context: ., target: runner }
    image: nomorevibe-web:${RELEASE_TAG:-local}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://nomorevibe:nomorevibe@db:5432/nomorevibe
      DB_POOL_MAX: "8"
      NEXT_PUBLIC_SITE_URL: http://localhost:3200
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (openssl rand -hex 32)}
      VISITOR_HASH_SECRET: ${VISITOR_HASH_SECRET:?VISITOR_HASH_SECRET is required (openssl rand -hex 32)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-deploy-admin}
      CRON_SECRET: ${CRON_SECRET:-local-deploy-cron}
      CRAWL_REVIEW_READY: ${CRAWL_REVIEW_READY:-false}
      ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      TRUSTED_PROXY_HOPS: "0"
      LOG_LEVEL: info
      HOSTNAME: 0.0.0.0
    ports:
      - "3200:3000"
    cpus: 2.0
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  scheduler:
    <<: *worker
    command: ["node", "--import", "tsx", "scripts/worker-supervisor.ts", "--role=scheduler"]
    environment:
      <<: *worker-environment
      WORKER_ROLE: scheduler
      DB_POOL_MAX: "2"
      WORKER_JOB_TIMEOUT_SECONDS: "120"
    cpus: 0.25
    mem_limit: 256m

  crawler:
    <<: *worker
    command: ["node", "--import", "tsx", "scripts/worker-supervisor.ts", "--role=crawler"]
    environment:
      <<: *worker-environment
      WORKER_ROLE: crawler
      DB_POOL_MAX: "4"
      WORKER_JOB_TIMEOUT_SECONDS: "180"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    mem_limit: 1536m

  reviewer:
    <<: *worker
    command: ["node", "--import", "tsx", "scripts/worker-supervisor.ts", "--role=reviewer"]
    environment:
      <<: *worker-environment
      WORKER_ROLE: reviewer
      DB_POOL_MAX: "3"
      WORKER_JOB_TIMEOUT_SECONDS: "180"
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CRAWL_REVIEW_MODEL: ${CRAWL_REVIEW_MODEL:-}
    mem_limit: 2g

  publisher:
    <<: *worker
    command: ["node", "--import", "tsx", "scripts/worker-supervisor.ts", "--role=publisher"]
    environment:
      <<: *worker-environment
      WORKER_ROLE: publisher
      DB_POOL_MAX: "3"
      WORKER_JOB_TIMEOUT_SECONDS: "180"
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    mem_limit: 1536m

  maintenance:
    <<: *worker
    command: ["node", "--import", "tsx", "scripts/worker-supervisor.ts", "--role=maintenance"]
    environment:
      <<: *worker-environment
      WORKER_ROLE: maintenance
      DB_POOL_MAX: "3"
      WORKER_JOB_TIMEOUT_SECONDS: "600"
    mem_limit: 1g

volumes:
  deploy-pgdata:
